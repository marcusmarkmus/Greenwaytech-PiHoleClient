name: Build, Test and Deploy PiholeClientProject

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}


permissions:
  contents: read
  checks: write #For publishing check runs (test results)
  pull-requests: write


# Cancel older runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest
    env:
      PROJECT_PATH: "./Greenwaytech.PiholeApiClient/Greenwaytech.PiholeApiClient.csproj"
      TEST_PROJECT_PATH: "./Greenwaytech.PiholeApiClient.Test/Greenwaytech.PiholeApiClient.Test.csproj"
      CONFIGURATION: "Release"
      TEST_RESULTS_DIR: "TestResults"
      NUGET_SOURCE_URL: "https://api.nuget.org/v3/index.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore PiholeClientProject
        run: dotnet restore "$PROJECT_PATH"

      - name: Build PiholeClientProject
        run: dotnet build "$PROJECT_PATH" -c "$CONFIGURATION" --no-restore /warnaserror 

      - name: Restore Testproject
        run: dotnet restore "$TEST_PROJECT_PATH"
      - name: Build Testproject
        run: dotnet build "$TEST_PROJECT_PATH" -c "$CONFIGURATION" --no-restore /warnaserror 

      - name: Test (trx + coverage)
        run: |
          mkdir -p "$TEST_RESULTS_DIR"
          dotnet test "$TEST_PROJECT_PATH" -c "$CONFIGURATION" --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory "$TEST_RESULTS_DIR" \
            -- NUnit.DefaultTimeout=120000
        timeout-minutes: 30
        env:
          CI: true

      - name: Generate HTML coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: ${{ env.TEST_RESULTS_DIR }}/**/coverage.cobertura.xml
          targetdir: ${{ env.TEST_RESULTS_DIR }}/CoverageReport
          reporttypes: 'HtmlInline_AzurePipelines;Cobertura'

      - name: Upload Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-results
          path: |
            ${{ env.TEST_RESULTS_DIR }}/**/*.trx
            ${{ env.TEST_RESULTS_DIR }}/**/coverage.cobertura.xml
            ${{ env.TEST_RESULTS_DIR }}/CoverageReport/**/*
          if-no-files-found: warn
          retention-days: 7

      - name: Publish Test Results (Checks tab)
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ${{ env.TEST_RESULTS_DIR }}/**/*.trx
          check_name: 'Test Results'

      - name: NuGet Push (publish if version changed)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/nuget-push
        with:
          project_path: ${{ env.PROJECT_PATH }}
          configuration: ${{ env.CONFIGURATION }}
          nuget_api_key: ${{ secrets.NUGET_API_KEY }}
          nuget_source_url: ${{ env.NUGET_SOURCE_URL }}