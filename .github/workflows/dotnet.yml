name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

# Cancel older runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      
      SOLUTION_PATH: "./Greenwaytech.PiholeApiClient.slnx"
      CONFIGURATION: "Release"
      TEST_RESULTS_DIR: "TestResults"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$SOLUTION_PATH"

      - name: Build
        run: dotnet build "$SOLUTION_PATH" -c "$CONFIGURATION" --no-restore #/warnaserror #Add this back in later and fix warnings

      - name: Test (trx + coverage)
        run: |
          mkdir -p "$TEST_RESULTS_DIR"
          dotnet test "$SOLUTION_PATH" -c "$CONFIGURATION" --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory "$TEST_RESULTS_DIR"

      - name: Upload Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage
          path: |
            ${{ env.TEST_RESULTS_DIR }}/**/*.trx
            ${{ env.TEST_RESULTS_DIR }}/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

      # Optional: publish app binaries
      # - name: Publish (app)
      #   run: dotnet publish ./src/YourApp/YourApp.csproj -c "$CONFIGURATION" -o publish
      #
      # - name: Upload Publish Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-publish
      #     path: publish